name: Install Emacs
description: >-
  Install emacs-nox and any extra apt packages, with the package download
  retried when a slow mirror stalls it (install.sh says how). Call it with
  `timeout-minutes: 5` on the step: the retries take 4 minutes at the worst.
inputs:
  packages:
    description: Extra apt packages to install beside emacs-nox.
    default: ''
runs:
  using: composite
  steps:
    - name: Install Emacs
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
