name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
      # The first step to reach the server starts it.
      - name: Run agent plan tests
        run: |
          emacsclient --alternate-editor="" --socket-name=tests --eval '
          (progn
            (load (expand-file-name "tests/run-agent-plans.el" (getenv "GITHUB_WORKSPACE")) nil t)
            (wgn-agent-plans-run-tests))
          '
      - name: Stop test server
        if: always()
        run: |
          emacsclient --socket-name=tests --eval '
          (kill-emacs)
          '

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test image provisioning and the Gondolin runner
        run: node --test tests/image.test.mjs tests/offline-run.test.mjs

  # offline-run uses Gondolin only on Darwin.
  image-tools:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - name: Test packaged image tools
        run: nix build --print-build-logs .#checks.aarch64-darwin.offline-run-image-tools

  bwrap-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      # Otherwise AppArmor strips the capabilities of the namespaces bwrap
      # creates, and it cannot bring up loopback in the guest's network.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test the Bubblewrap offline-run
        run: nix build --print-build-logs .#checks.x86_64-linux.offline-run-sandbox
